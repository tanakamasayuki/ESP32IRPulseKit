[project]
name = "esp32irpulskit-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-embedded>=2.0",
    "pytest-embedded-serial>=2.0",
    "pytest-embedded-arduino-cli>=1.10.0",
    "pytest-html>=4.1.1",
    "PyYAML>=6.0.2",
]

[tool.pytest.ini_options]
addopts = "--save-state"
pythonpath = ["."]
# Two-board RX/TX pairs for hardware/ (`--combo NAME`, or `--combo all` for every
# pair). The IR link is over the air, so the cross pairs work too.
arduino_combos = [
    "s3:       primary=rx_esp32s3,tx=tx_esp32s3",
    "esp32:    primary=rx_esp32,tx=tx_esp32",
    "s3rx-esp32tx: primary=rx_esp32s3,tx=tx_esp32",
    "esp32rx-s3tx: primary=rx_esp32,tx=tx_esp32s3",
]
filterwarnings = [
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]
